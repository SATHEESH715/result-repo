# Approach 2: the report is built from the result files that the project repos upload to blob storage.
# Blob storage cannot start a pipeline by itself. This starts when a stripe pushes its result file to result-repo,
# which happens at the same time as the blob upload. It also runs on a schedule and can be run by hand.
trigger:
  batch: true            # if several stripes push close together, build one report, not several
  branches:
    include:
      - main
  paths:
    include:
      - asb/*
      - allocations/*
      - analysis/*
      - customers/*
      - homeswapper/*
      - homelessnesssolutions/*
      - roughsleepers/*
      - servicecharges/*
pr: none

schedules:
  - cron: '0 2 * * 1-5'
    displayName: Weekdays 2AM (UTC)
    branches:
      include:
        - main
    always: true

# Runs on the self-hosted agent in the Default pool (Windows). To use Microsoft-hosted agents instead,
# once the free grant is approved, replace this with:  vmImage: ubuntu-latest
pool:
  name: Default

variables:
  - group: test-reporting          # holds the secret variable teamsWorkflowUrl
  - name: storageAccount
    value: testreportsatheesh01
  - name: container
    value: test-results
  - name: azureServiceConnection
    value: azure-test-reporting    # the name of your Azure service connection

steps:
  - checkout: self
    clean: true

  - task: NodeTool@0
    displayName: Use Node 22
    inputs:
      versionSpec: '22.x'

  - powershell: Start-Sleep -Seconds 90
    displayName: Wait so the blob uploads can finish

  - task: AzureCLI@2
    displayName: Download the result files from blob storage
    inputs:
      azureSubscription: $(azureServiceConnection)
      scriptType: ps
      scriptLocation: inlineScript
      inlineScript: |
        New-Item -ItemType Directory -Force -Path blob-results | Out-Null
        az storage blob download-batch --account-name "$(storageAccount)" --source "$(container)" --destination blob-results --pattern "*/summary.json" --auth-mode login

  - script: node scripts/post-report.mjs blob-results
    displayName: Post one report to Teams (from blob storage)
    env:
      TEAMS_WORKFLOW_URL: $(teamsWorkflowUrl)
      SOURCE_LABEL: blob storage
